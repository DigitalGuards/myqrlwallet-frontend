name: Refresh caches

# A pull request reads caches from its base branch and the default branch only,
# and the test workflow does not run on dev pushes. When the lockfile changes on
# dev, this rebuilds what every later pull request would otherwise download. The
# two browser builds run apart so neither cache also carries the other build.
on:
  push:
    branches: [dev]
    paths:
      - package-lock.json
      - .github/actions/setup-chromium/**
      - .github/workflows/refresh-caches.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [headless-shell, full]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Chromium (${{ matrix.browser }})
        uses: ./.github/actions/setup-chromium
        with:
          browser: ${{ matrix.browser }}
