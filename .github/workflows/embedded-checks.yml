name: Embedded checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # One job builds the self-contained document once, verifies it offline in
  # every language and publishes the exact bytes it verified. Each language
  # still runs as its own invocation and uploads its own report, so
  # check-i18n-shards.mjs verifies the same five per-language reports.
  embedded:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scheduled runs start from the default branch; the weekly run tests dev.
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.x"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Audit production dependencies
        run: node scripts/audit-gate.mjs
      - name: Build the embedded wallet
        run: npm run build:embedded
      - name: Assert the output is self-contained
        run: npm run check:embedded
      - name: Verify the recorded digest
        working-directory: dist-embedded
        run: sha256sum -c index.html.sha256
      - name: Install Chromium for offline language checks
        id: chromium
        uses: ./.github/actions/setup-chromium

      # Every language runs even after another one failed, so all reports are
      # collected. Reports land in the layout download-artifact produces.
      - name: Verify the embedded language offline (en)
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        env:
          LANGUAGE: en
          I18N_SCREENSHOT_DIR: ${{ runner.temp }}/i18n-embedded/en
          I18N_REPORT_PATH: ${{ runner.temp }}/i18n-embedded-results/i18n-embedded-en/en.json
        run: npm run smoke:i18n:embedded -- --languages "$LANGUAGE"
      - name: Verify the embedded language offline (de)
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        env:
          LANGUAGE: de
          I18N_SCREENSHOT_DIR: ${{ runner.temp }}/i18n-embedded/de
          I18N_REPORT_PATH: ${{ runner.temp }}/i18n-embedded-results/i18n-embedded-de/de.json
        run: npm run smoke:i18n:embedded -- --languages "$LANGUAGE"
      - name: Verify the embedded language offline (es)
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        env:
          LANGUAGE: es
          I18N_SCREENSHOT_DIR: ${{ runner.temp }}/i18n-embedded/es
          I18N_REPORT_PATH: ${{ runner.temp }}/i18n-embedded-results/i18n-embedded-es/es.json
        run: npm run smoke:i18n:embedded -- --languages "$LANGUAGE"
      - name: Verify the embedded language offline (ru)
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        env:
          LANGUAGE: ru
          I18N_SCREENSHOT_DIR: ${{ runner.temp }}/i18n-embedded/ru
          I18N_REPORT_PATH: ${{ runner.temp }}/i18n-embedded-results/i18n-embedded-ru/ru.json
        run: npm run smoke:i18n:embedded -- --languages "$LANGUAGE"
      - name: Verify the embedded language offline (zh-CN)
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        env:
          LANGUAGE: zh-CN
          I18N_SCREENSHOT_DIR: ${{ runner.temp }}/i18n-embedded/zh-CN
          I18N_REPORT_PATH: ${{ runner.temp }}/i18n-embedded-results/i18n-embedded-zh-CN/zh-CN.json
        run: npm run smoke:i18n:embedded -- --languages "$LANGUAGE"

      - name: Upload language shard result (en)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i18n-embedded-en
          path: ${{ runner.temp }}/i18n-embedded-results/i18n-embedded-en/en.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload language shard result (de)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i18n-embedded-de
          path: ${{ runner.temp }}/i18n-embedded-results/i18n-embedded-de/de.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload language shard result (es)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i18n-embedded-es
          path: ${{ runner.temp }}/i18n-embedded-results/i18n-embedded-es/es.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload language shard result (ru)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i18n-embedded-ru
          path: ${{ runner.temp }}/i18n-embedded-results/i18n-embedded-ru/ru.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload language shard result (zh-CN)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i18n-embedded-zh-CN
          path: ${{ runner.temp }}/i18n-embedded-results/i18n-embedded-zh-CN/zh-CN.json
          if-no-files-found: error
          retention-days: 7

      - name: Require every language and exact language coverage
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        env:
          REPORT_DIRECTORY: ${{ runner.temp }}/i18n-embedded-results
        run: node scripts/check-i18n-shards.mjs --suite embedded --directory "$REPORT_DIRECTORY"
      # The smokes read the document in place; check that the bytes to attest
      # and publish are still the ones the recorded digest names.
      - name: Verify the digest of the checked document
        working-directory: dist-embedded
        run: sha256sum -c index.html.sha256
      - name: Attest the build provenance
        if: ${{ success() && startsWith(github.ref, 'refs/tags/embedded-v') }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-embedded/index.html
      - name: Upload the embedded wallet
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myqrlwallet-embedded
          path: |
            dist-embedded/index.html
            dist-embedded/index.html.sha256
          if-no-files-found: error
