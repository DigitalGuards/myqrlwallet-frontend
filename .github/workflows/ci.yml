name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [22.22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit production dependencies
        run: node scripts/audit-gate.mjs

      - name: Run lint
        run: npm run lint

      - name: Check lint ratchet
        env:
          LINT_RATCHET_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$LINT_RATCHET_BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "lint-ratchet: new branch has no base commit; skipping shrink-only comparison"
            npm run lint:ratchet
          else
            npm run lint:ratchet -- --base-ref "$LINT_RATCHET_BASE"
          fi

      - name: Run typecheck
        run: npm run typecheck

      - name: Test language shard coverage checks
        run: node --test scripts/i18n-shards.test.mjs scripts/i18n-coverage.test.mjs

      - name: Run tests
        run: npm test -- --runInBand

      - name: Run build
        run: npm run build

      # Boot smoke: a dependency bump can lint, test and bundle cleanly and
      # still brick the app at runtime. This serves dist/ and opens it in a
      # real browser; it is part of the required check that gates Dependabot
      # auto-merge on main.
      - name: Install Chromium for the boot smoke
        uses: ./.github/actions/setup-chromium

      - name: Test smoke glyph detection
        run: node --test scripts/i18n-glyphs.test.mjs

      - name: Boot smoke (serve dist, render home and create-account)
        run: npm run smoke:boot

  language-smoke-shard:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.22.x]
        language: [en, de, es, ru, zh-CN]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run build
        run: npm run build

      - name: Install Chromium for the language smoke
        uses: ./.github/actions/setup-chromium

      - name: Language and phone layout smoke
        env:
          I18N_SCREENSHOT_DIR: ${{ runner.temp }}/i18n-web
          I18N_REPORT_PATH: ${{ runner.temp }}/i18n-web-results/${{ matrix.language }}.json
          LANGUAGE: ${{ matrix.language }}
        run: npm run smoke:i18n -- --languages "$LANGUAGE"

      - name: Upload language shard result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: i18n-web-${{ matrix.language }}
          path: ${{ runner.temp }}/i18n-web-results/${{ matrix.language }}.json
          if-no-files-found: error
          retention-days: 7

  # Keep the existing language-smoke job and its check context.
  language-smoke:
    needs: language-smoke-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Download all language reports
        uses: actions/download-artifact@v4
        with:
          pattern: i18n-web-*
          merge-multiple: true
          path: ${{ runner.temp }}/i18n-web-results
      - name: Require every shard and exact language coverage
        if: ${{ always() }}
        env:
          SHARDS_RESULT: ${{ needs.language-smoke-shard.result }}
          REPORT_DIRECTORY: ${{ runner.temp }}/i18n-web-results
        run: |
          node scripts/check-i18n-shards.mjs --suite web --directory "$REPORT_DIRECTORY"
          test "$SHARDS_RESULT" = success

  embedded-checks:
    uses: ./.github/workflows/embedded-checks.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  # Keep the standalone embedded check name when calling the reusable workflow.
  embedded:
    needs: embedded-checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all embedded checks
        env:
          EMBEDDED_RESULT: ${{ needs.embedded-checks.result }}
        run: test "$EMBEDDED_RESULT" = success

  # Preserve the existing required check, including its matrix context name.
  # All smoke shards, coverage checks, lint/tests/build and embedded must pass.
  lint-and-build:
    needs: [lint-test-build, language-smoke, embedded]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.22.x]
    steps:
      - name: Require all CI checks
        env:
          CHECKS_RESULT: ${{ needs.lint-test-build.result }}
          LANGUAGE_RESULT: ${{ needs.language-smoke.result }}
          EMBEDDED_RESULT: ${{ needs.embedded.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$LANGUAGE_RESULT" = success
          test "$EMBEDDED_RESULT" = success

  docker:
    needs: lint-and-build
    runs-on: ubuntu-latest
    # Only build Docker images on push to main/dev (not PRs)
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_RPC_URL_PRODUCTION=${{ vars.VITE_RPC_URL_PRODUCTION || 'https://qrlwallet.com/api/qrl-rpc' }}
            VITE_SERVER_URL_PRODUCTION=${{ vars.VITE_SERVER_URL_PRODUCTION || 'https://qrlwallet.com/api' }}
            VITE_EXPLORER_URL_PRODUCTION=${{ vars.VITE_EXPLORER_URL_PRODUCTION || 'https://zondscan.com' }}
            VITE_CUSTOMERC20FACTORY_ADDRESS=${{ vars.VITE_CUSTOMERC20FACTORY_ADDRESS }}
            VITE_DEPLOYER=${{ vars.VITE_DEPLOYER }}
            VITE_WALLET_PROFILE=${{ vars.VITE_WALLET_PROFILE }}
            VITE_V3_RPC_URL=${{ vars.VITE_V3_RPC_URL }}
            VITE_V3_SERVER_URL=${{ vars.VITE_V3_SERVER_URL }}
            VITE_V3_EXPLORER_URL=${{ vars.VITE_V3_EXPLORER_URL }}
            VITE_V3_CHAIN_ID=${{ vars.VITE_V3_CHAIN_ID }}
            VITE_V3_GENESIS_HASH=${{ vars.VITE_V3_GENESIS_HASH }}

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    # Disabled - Kubernetes deployment not configured
    if: false

    permissions:
      contents: read

    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update image tag in kustomization
        run: |
          cd deploy/k8s
          # Update the image tag to the SHA-prefixed tag
          kustomize edit set image ghcr.io/${{ env.IMAGE_NAME }}:main-${{ github.sha }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -k deploy/k8s/
          kubectl rollout status deployment/myqrlwallet-frontend -n myqrlwallet --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n myqrlwallet -l app=myqrlwallet-frontend
          kubectl get services -n myqrlwallet -l app=myqrlwallet-frontend
