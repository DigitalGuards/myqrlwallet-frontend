name: Setup Chromium
description: Cache the locked Playwright Chromium build and language fonts, with launch-checked system dependencies

inputs:
  browser:
    description: >-
      headless-shell (default) installs the Chromium headless shell that
      chromium.launch() uses. full installs the full Chromium build that
      channel "chromium" launches (the approval visibility smoke).
    required: false
    default: headless-shell

runs:
  using: composite
  steps:
    - name: Read the installed Playwright version from the lockfile
      id: playwright
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
      run: |
        node <<'NODE'
        const { appendFileSync } = require('node:fs');
        const version = require('./package-lock.json').packages['node_modules/playwright'].version;
        if (version !== require('playwright/package.json').version ||
            version !== require('playwright-core/package.json').version) {
          throw new Error('Run npm ci before setting up Chromium: Playwright must match package-lock.json');
        }
        // Each selection keeps its own cache key, so the existing headless key is unchanged.
        const selections = {
          'headless-shell': { install: '--only-shell', key: 'chromium-headless-v1', channel: '' },
          full: { install: '--no-shell', key: 'chromium-full-v1', channel: 'chromium' },
        };
        const selection = selections[process.env.BROWSER];
        if (!selection) throw new Error(`Unknown browser input: ${process.env.BROWSER}`);
        appendFileSync(
          process.env.GITHUB_OUTPUT,
          `version=${version}\ninstall=${selection.install}\nkey=${selection.key}\nchannel=${selection.channel}\n`,
        );
        NODE

    - name: Cache the Playwright Chromium build
      id: browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.key }}

    - name: Restore or download the Chromium build
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
        BROWSER_CACHE_HIT: ${{ steps.browsers.outputs.cache-hit }}
        INSTALL_OPTION: ${{ steps.playwright.outputs.install }}
      run: |
        if [[ "$BROWSER_CACHE_HIT" == 'true' ]]; then
          echo "Chromium browser ($BROWSER): cached (exact Playwright version)."
        else
          echo "Chromium browser ($BROWSER): cache miss; downloading."
          npx --no-install playwright install "$INSTALL_OPTION" chromium
          echo "Chromium browser ($BROWSER): downloaded."
        fi

    - name: Cache exact language font packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/i18n-font-packages
        key: ${{ runner.os }}-${{ runner.arch }}-i18n-fonts-${{ hashFiles('.github/actions/setup-chromium/fonts.lock') }}-v1

    - name: Install language fonts independently of Chromium dependencies
      shell: bash
      env:
        I18N_FONT_PACKAGE_CACHE: ${{ runner.temp }}/i18n-font-packages
      run: bash "$GITHUB_ACTION_PATH/install-fonts.sh"

    - name: Check Chromium and install system dependencies if needed
      shell: bash
      env:
        CHROMIUM_CHANNEL: ${{ steps.playwright.outputs.channel }}
      run: |
        if node "$GITHUB_ACTION_PATH/check-launch.mjs"; then
          echo "Chromium dependencies: present; skipping install-deps."
        else
          echo "Chromium dependencies: installing after failed launch check."
          if ! npx --no-install playwright install-deps chromium; then
            echo "::error::Chromium system dependency installation failed."
            exit 1
          fi
          if ! node "$GITHUB_ACTION_PATH/check-launch.mjs"; then
            echo "::error::Chromium launch check failed after installing system dependencies."
            exit 1
          fi
          echo "Chromium dependencies: installed; launch check passed."
        fi
